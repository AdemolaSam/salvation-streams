    <title>Salvation Streams Outreach Missions</title>
    <script>
      (function restoreGitHubPagesRoute(locationRef) {
        if (locationRef.search[1] !== '/') return;

        var decodedRoute = locationRef.search
          .slice(1)
          .split('&')
          .map(function (segment) {
            return segment.replace(/~and~/g, '&');
          })
          .join('?');

        window.history.replaceState(
          null,
          null,
          locationRef.pathname.slice(0, -1) + decodedRoute + locationRef.hash,
        );
      })(window.location);
    </script>
    <meta name="description" content="Reaching the nations with hope, healing, and the Gospel — medical outreach, crusades, relief, and discipleship." />
